# CI застосунку lab-argo-app. Кладеться в lab-argo-app/.github/workflows/ci.yml на етапі 3.
# 1) build: збирає Docker-образ, версіонує його як 1.0.<номер запуску>, пушить у Docker Hub.
# 2) update-chart: у репозиторії чартів підставляє нову версію в values.yaml (image.tag)
#    і Chart.yaml (version, appVersion), комітить. Цей коміт запускає release.yml у lab-argo-charts,
#    chart-releaser публікує нову версію чарту, Argo CD (targetRevision "*") її підхоплює.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: docker.io/vitaliikozyr/lab-argo-app
  CHARTS_REPO: vikozyr/lab-argo-charts
  CHART_PATH: charts/lab-argo-app

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute version
        id: ver
        # run_number росте з кожним запуском воркфлоу: 1.0.1, 1.0.2, ...
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  update-chart:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout charts repo
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CHARTS_REPO }}
          # PAT з правом Contents: write на lab-argo-charts.
          # GITHUB_TOKEN не підходить: він діє лише в цьому репозиторії,
          # а його пуші не запускають воркфлоу в інших репозиторіях.
          token: ${{ secrets.CHARTS_REPO_TOKEN }}

      - name: Bump image tag and chart version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # yq (mikefarah) є на ubuntu-latest, коментарі у YAML зберігає
          yq -i '.image.tag = strenv(VERSION)' "$CHART_PATH/values.yaml"
          yq -i '.version = strenv(VERSION) | .appVersion = strenv(VERSION)' "$CHART_PATH/Chart.yaml"
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "lab-argo-app: image ${VERSION} (${GITHUB_SHA::7})"
          git push
